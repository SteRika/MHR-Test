name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Hero Rush Live v1.4 Yellow Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct v1.4 Android source
        shell: bash
        run: |
          set -euxo pipefail
          cat source-parts/part-*.b64 > HeroRushLive_v1.4_Android_Source.b64
          base64 --decode HeroRushLive_v1.4_Android_Source.b64 > HeroRushLive_v1.4_Android_Source.zip
          echo "ea2ffe8d2b5f96e06eb70e8e159a1ca9d9d4bde191c95bf50a3df579a99a0e27  HeroRushLive_v1.4_Android_Source.zip" | sha256sum -c -
          mkdir android-project
          unzip -q HeroRushLive_v1.4_Android_Source.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/assets/cards.js
          test -f android-project/app/src/main/assets/v14-yellow-data.js
          test -f android-project/app/src/main/assets/app.js
          grep -q "versionCode 15" android-project/app/build.gradle
          grep -q "versionName '1.4-yellow-alpha'" android-project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate game JavaScript and card pool
        working-directory: android-project
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/cards.js
          node --check app/src/main/assets/v14-yellow-data.js
          node --check app/src/main/assets/app.js
          node - <<'JS'
          global.window={};
          require('./app/src/main/assets/cards.js');
          require('./app/src/main/assets/v14-yellow-data.js');
          const db=window.CARD_DB;
          if(db.length!==120) throw new Error('Expected 120 BP01 Character cards');
          const live=db.filter(c=>c.impl==='live');
          const red=live.filter(c=>c.color==='Red');
          const yellow=live.filter(c=>c.color==='Yellow');
          if(live.length!==59) throw new Error('Expected 59 playable cards, got '+live.length);
          if(red.length!==30) throw new Error('Expected 30 playable Red cards');
          if(yellow.length!==29) throw new Error('Expected 29 playable Yellow cards');
          const pending=db.find(c=>c.code==='BP01-049');
          if(!pending || pending.impl==='live') throw new Error('BP01-049 must remain reference-only');
          console.log('Validated:', {total:db.length, live:live.length, red:red.length, yellow:yellow.length});
          JS
          grep -q "card-border-yellow" app/src/main/assets/app.css
          grep -q "card-border-blue" app/src/main/assets/app.css
          grep -q "card-border-green" app/src/main/assets/app.css
          grep -q "card-border-red" app/src/main/assets/app.css

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk HeroRushLive-v1.4-yellow-alpha-debug.apk
          sha256sum HeroRushLive-v1.4-yellow-alpha-debug.apk > HeroRushLive-v1.4-yellow-alpha-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroRushLive-v1.4-yellow-alpha-debug
          path: |
            HeroRushLive-v1.4-yellow-alpha-debug.apk
            HeroRushLive-v1.4-yellow-alpha-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
