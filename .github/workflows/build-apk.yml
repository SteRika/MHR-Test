name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Hero Rush Live v1.9.1 Reposition Tap Fix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct v1.9 Android source
        shell: bash
        run: |
          set -euxo pipefail
          cat source-parts/part-*.b64 > HeroRushLive_v1.9_Android_Source.b64
          base64 --decode HeroRushLive_v1.9_Android_Source.b64 > HeroRushLive_v1.9_Android_Source.zip
          echo "3a9c9f9200f0221faa254b03de71f5f6b68fe6bea7808e93425ec63f4ea1a4e9  HeroRushLive_v1.9_Android_Source.zip" | sha256sum -c -
          mkdir android-project
          unzip -q HeroRushLive_v1.9_Android_Source.zip -d android-project
          test -f android-project/app/src/main/assets/sp01-data.js
          test -f android-project/tools/sp01-validation.js
          grep -q "versionCode 23" android-project/app/build.gradle
          grep -q "versionName '1.9-sp01-catalog-alpha'" android-project/app/build.gradle
          grep -q 'android:screenOrientation="portrait"' android-project/app/src/main/AndroidManifest.xml

      - name: Apply v1.9.1 reposition interaction fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 patches/v191-reposition-fix.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate v1.9.1 rules, SP01 catalog and reposition interaction
        working-directory: android-project
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/cards.js
          node --check app/src/main/assets/sp01-data.js
          node --check app/src/main/assets/v14-yellow-data.js
          node --check app/src/main/assets/v15-blue-green-data.js
          node --check app/src/main/assets/rules-core.js
          node --check app/src/main/assets/app.js
          node tools/rules-regression.js
          node tools/sp01-validation.js
          node tools/reposition-interaction-validation.js
          grep -q "versionCode 24" app/build.gradle
          grep -q "versionName '1.9.1-reposition-fix'" app/build.gradle
          grep -q 'android:label="Hero Rush Live v1.9.1"' app/src/main/AndroidManifest.xml
          grep -q 'id="collectionSet"' app/src/main/assets/index.html
          grep -q '>SP01<' app/src/main/assets/index.html
          grep -q 'value="0">R-0' app/src/main/assets/index.html
          grep -q 'value="5">R-5' app/src/main/assets/index.html
          grep -q '200 BP01 + SP01' app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk HeroRushLive-v1.9.1-reposition-fix-debug.apk
          sha256sum HeroRushLive-v1.9.1-reposition-fix-debug.apk > HeroRushLive-v1.9.1-reposition-fix-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroRushLive-v1.9.1-reposition-fix-debug
          path: |
            HeroRushLive-v1.9.1-reposition-fix-debug.apk
            HeroRushLive-v1.9.1-reposition-fix-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
