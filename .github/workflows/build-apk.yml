name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Hero Rush Live v1.5 Blue + Green Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct v1.5 Android source
        shell: bash
        run: |
          set -euxo pipefail
          cat source-parts/part-*.b64 > HeroRushLive_v1.5_Android_Source.b64
          base64 --decode HeroRushLive_v1.5_Android_Source.b64 > HeroRushLive_v1.5_Android_Source.zip
          echo "164ae29cf50648e733637ce2ec6c15072539e4fd985cee16c433741e57d03728  HeroRushLive_v1.5_Android_Source.zip" | sha256sum -c -
          mkdir android-project
          unzip -q HeroRushLive_v1.5_Android_Source.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/assets/cards.js
          test -f android-project/app/src/main/assets/v14-yellow-data.js
          test -f android-project/app/src/main/assets/v15-blue-green-data.js
          test -f android-project/app/src/main/assets/app.js
          grep -q "versionCode 16" android-project/app/build.gradle
          grep -q "versionName '1.5-blue-green-alpha'" android-project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate game JavaScript and full BP01 pool
        working-directory: android-project
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/cards.js
          node --check app/src/main/assets/v14-yellow-data.js
          node --check app/src/main/assets/v15-blue-green-data.js
          node --check app/src/main/assets/app.js
          node - <<'JS'
          global.window={};
          require('./app/src/main/assets/cards.js');
          require('./app/src/main/assets/v14-yellow-data.js');
          require('./app/src/main/assets/v15-blue-green-data.js');
          const db=window.CARD_DB;
          if(db.length!==120) throw new Error('Expected 120 BP01 Character cards');
          const live=db.filter(c=>c.impl==='live');
          const count=color=>live.filter(c=>c.color===color).length;
          const expected={Red:30,Yellow:29,Blue:30,Green:28};
          if(live.length!==117) throw new Error('Expected 117 playable cards, got '+live.length);
          for(const [color,n] of Object.entries(expected)){
            if(count(color)!==n) throw new Error('Expected '+n+' playable '+color+' cards, got '+count(color));
          }
          const refs=db.filter(c=>c.impl!=='live').map(c=>c.code).sort();
          const expectedRefs=['BP01-049','BP01-091','BP01-092'];
          if(JSON.stringify(refs)!==JSON.stringify(expectedRefs)) throw new Error('Unexpected reference-only set: '+JSON.stringify(refs));
          console.log('Validated BP01 v1.5:', {total:db.length,playable:live.length,Red:count('Red'),Yellow:count('Yellow'),Blue:count('Blue'),Green:count('Green'),referenceOnly:refs});
          JS
          grep -q "card-border-red" app/src/main/assets/app.css
          grep -q "card-border-yellow" app/src/main/assets/app.css
          grep -q "card-border-blue" app/src/main/assets/app.css
          grep -q "card-border-green" app/src/main/assets/app.css

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk HeroRushLive-v1.5-blue-green-alpha-debug.apk
          sha256sum HeroRushLive-v1.5-blue-green-alpha-debug.apk > HeroRushLive-v1.5-blue-green-alpha-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroRushLive-v1.5-blue-green-alpha-debug
          path: |
            HeroRushLive-v1.5-blue-green-alpha-debug.apk
            HeroRushLive-v1.5-blue-green-alpha-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
