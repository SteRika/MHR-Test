name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Hero Rush Live v1.3.1 Card Library
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct v1.3 Android base
        shell: bash
        run: |
          set -euxo pipefail
          cat source-parts/part-*.b64 > HeroRushLive_v1.3_Android_Source.b64
          base64 --decode HeroRushLive_v1.3_Android_Source.b64 > HeroRushLive_v1.3_Android_Source.zip
          mkdir android-project
          unzip -q HeroRushLive_v1.3_Android_Source.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/assets/cards.js
          test -f android-project/app/src/main/assets/app.js

      - name: Apply v1.3.1 card library patch
        shell: bash
        run: |
          set -euxo pipefail
          cp patches/v131-card-data.js android-project/app/src/main/assets/v131-card-data.js
          cp patches/v131-card-ui.js android-project/app/src/main/assets/v131-card-ui.js
          cp patches/v131-card-ui.css android-project/app/src/main/assets/v131-card-ui.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-project/app/src/main/assets/index.html")
          s=p.read_text()
          s=s.replace('<link rel="stylesheet" href="app.css" />','<link rel="stylesheet" href="app.css" />\n  <link rel="stylesheet" href="v131-card-ui.css" />')
          s=s.replace('<script src="cards.js"></script>','<script src="cards.js"></script>\n<script src="v131-card-data.js"></script>')
          s=s.replace('<script src="app.js"></script>','<script src="app.js"></script>\n<script src="v131-card-ui.js"></script>')
          p.write_text(s)
          g=Path("android-project/app/build.gradle")
          x=g.read_text().replace("versionCode 13","versionCode 14").replace("versionName '1.3-alpha'","versionName '1.3.1-card-library-alpha'")
          g.write_text(x)
          PY
          grep -q 'v131-card-data.js' android-project/app/src/main/assets/index.html
          grep -q "versionCode 14" android-project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate game JavaScript
        working-directory: android-project
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/cards.js
          node --check app/src/main/assets/v131-card-data.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/v131-card-ui.js
          node - <<'JS'
          global.window={};
          require('./app/src/main/assets/cards.js');
          require('./app/src/main/assets/v131-card-data.js');
          const db=window.CARD_DB;
          if(db.length!==120) throw new Error('Expected 120 BP01 Character cards');
          for(const c of db){
            if(c.level==null||c.range==null||c.power==null||!c.rarity||!c.color) throw new Error('Missing metadata: '+c.code);
          }
          for(const color of ['Red','Yellow','Blue','Green']){
            if(db.filter(c=>c.color===color).length!==30) throw new Error('Expected 30 '+color+' cards');
          }
          console.log('Validated 120 BP01 Character cards');
          JS

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk HeroRushLive-v1.3.1-card-library-debug.apk
          sha256sum HeroRushLive-v1.3.1-card-library-debug.apk > HeroRushLive-v1.3.1-card-library-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroRushLive-v1.3.1-card-library-debug
          path: |
            HeroRushLive-v1.3.1-card-library-debug.apk
            HeroRushLive-v1.3.1-card-library-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
