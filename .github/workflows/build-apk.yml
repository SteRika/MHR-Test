name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Hero Rush Live v1.7.4 Positional Range Fix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct v1.7 Android source
        shell: bash
        run: |
          set -euxo pipefail
          cat source-parts/part-*.b64 > HeroRushLive_v1.7_Android_Source.b64
          base64 --decode HeroRushLive_v1.7_Android_Source.b64 > HeroRushLive_v1.7_Android_Source.zip
          echo "cf9e2d16f66bcdd0fe4a1e81bf732e2d68a38e5ba1cd67c39eab704633b11ad8  HeroRushLive_v1.7_Android_Source.zip" | sha256sum -c -
          mkdir android-project
          unzip -q HeroRushLive_v1.7_Android_Source.zip -d android-project

      - name: Apply v1.7.1, v1.7.2 and v1.7.4 fixes
        shell: bash
        run: |
          set -euxo pipefail
          cp patches/v171-layout-fix.css android-project/app/src/main/assets/v171-layout-fix.css
          cp patches/v171-layout-fix.js android-project/app/src/main/assets/v171-layout-fix.js
          cp patches/v172-portrait.css android-project/app/src/main/assets/v172-portrait.css
          cp patches/v172-portrait.js android-project/app/src/main/assets/v172-portrait.js

          python3 - <<'PY'
          from pathlib import Path

          p=Path("android-project/app/src/main/assets/index.html")
          s=p.read_text()
          s=s.replace("<title>Hero Rush Live v1.7</title>","<title>Hero Rush Live v1.7.4</title>")
          s=s.replace('<link rel="stylesheet" href="app.css" />','<link rel="stylesheet" href="app.css" />\n  <link rel="stylesheet" href="v171-layout-fix.css" />\n  <link rel="stylesheet" href="v172-portrait.css" />')
          s=s.replace('LIVE · v1.7</small>','LIVE · v1.7.4</small>')
          s=s.replace('<button id="setBaseButton">SET BASE</button>','<button id="setBaseButton">SET 1 / DRAW 1</button>')
          s=s.replace('<script src="app.js"></script>','<script src="app.js"></script>\n<script src="v171-layout-fix.js"></script>\n<script src="v172-portrait.js"></script>')
          p.write_text(s)

          p=Path("android-project/app/build.gradle")
          s=p.read_text().replace("versionCode 17","versionCode 21").replace("versionName '1.7-arena-alpha'","versionName '1.7.4-positional-range'")
          p.write_text(s)

          p=Path("android-project/app/src/main/AndroidManifest.xml")
          s=p.read_text().replace('android:label="Hero Rush Live v1.7"','android:label="Hero Rush Live v1.7.4"').replace('android:screenOrientation="sensorLandscape"','android:screenOrientation="portrait"')
          p.write_text(s)

          p=Path("android-project/app/src/main/assets/app.js")
          s=p.read_text().replace("Hero Rush Live v1.7 · Arena UI Alpha","Hero Rush Live v1.7.2 · Portrait Arena")
          p.write_text(s)
          PY

          python3 patches/v173-range-rules.py
          python3 patches/v174-positional-range.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate v1.7.4 range rules and game pool
        working-directory: android-project
        shell: bash
        run: |
          set -euxo pipefail
          node --check app/src/main/assets/cards.js
          node --check app/src/main/assets/v14-yellow-data.js
          node --check app/src/main/assets/v15-blue-green-data.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/v171-layout-fix.js
          node --check app/src/main/assets/v172-portrait.js

          grep -q "targetDepth" app/src/main/assets/app.js
          grep -q "targetInRange" app/src/main/assets/app.js\n          grep -q "attackerPenalty" app/src/main/assets/app.js\n          grep -q "requiredRange" app/src/main/assets/app.js
          grep -q "R-.*FRONT + WINGS" app/src/main/assets/app.js
          grep -q "SET 1 / DRAW 1" app/src/main/assets/index.html
          grep -q 'android:screenOrientation="portrait"' app/src/main/AndroidManifest.xml
          grep -q "versionCode 20" app/build.gradle
          grep -q "versionName '1.7.3-range-fix'" app/build.gradle

          node - <<'JS'
          const targetDepth={front:1,wingL:2,wingR:2,back:3};
          const attackerPenalty={front:0,wingL:1,wingR:1,back:2};
          const required=(attacker,target)=>targetDepth[target]+attackerPenalty[attacker];
          const legal=(attacker,range,target)=>range>=required(attacker,target);
          const tests=[
            ['front',1,'front',true],['front',1,'wingL',false],['front',2,'wingL',true],['front',2,'back',false],['front',3,'back',true],
            ['wingL',1,'front',false],['wingL',2,'front',true],['wingL',2,'wingR',false],['wingL',3,'wingR',true],['wingL',4,'back',true],
            ['wingR',2,'front',true],['wingR',3,'wingL',true],['wingR',3,'back',false],
            ['back',2,'front',false],['back',3,'front',true],['back',3,'wingL',false],['back',4,'wingL',true],['back',4,'back',false],['back',5,'back',true]
          ];
          for(const [a,r,t,want] of tests){
            const got=legal(a,r,t);
            if(got!==want) throw new Error(`Range matrix failure ${a} R-${r} -> ${t}: ${got}, need ${required(a,t)}`);
          }
          console.log('Positional range matrix validated');
          JS

          node - <<'JS'
          global.window={};
          require('./app/src/main/assets/cards.js');
          require('./app/src/main/assets/v14-yellow-data.js');
          require('./app/src/main/assets/v15-blue-green-data.js');
          const db=window.CARD_DB;
          if(db.length!==120) throw new Error('Expected 120 BP01 Character cards');
          const live=db.filter(c=>c.impl==='live');
          if(live.length!==117) throw new Error('Expected 117 playable cards');
          const refs=db.filter(c=>c.impl!=='live').map(c=>c.code).sort();
          const expected=['BP01-049','BP01-091','BP01-092'];
          if(JSON.stringify(refs)!==JSON.stringify(expected)) throw new Error('Unexpected reference-only cards');
          console.log('v1.7.4 pool validation passed', {total:db.length,playable:live.length});
          JS

      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk HeroRushLive-v1.7.4-range-fix-debug.apk
          sha256sum HeroRushLive-v1.7.4-range-fix-debug.apk > HeroRushLive-v1.7.4-range-fix-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroRushLive-v1.7.4-range-fix-debug
          path: |
            HeroRushLive-v1.7.4-range-fix-debug.apk
            HeroRushLive-v1.7.4-range-fix-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
